# Yayın: master → https://cemcandan01.github.io/Last-Turn/ , gelistirme dalı → .../Last-Turn/dev/ (deneme sürümü).
# GitHub'da yalnız tip denetimi, kod denetimi ve derleme yapılır; geçmezse yayın yapılmaz. Duman (tarayıcı) testi regresyonun
# parçasıdır (regression sohbeti, onaydan önce) ve canlıdaki sürüm değiştiğinde (yeni canlı çıkış) yayından sonra canlı adreste
# koşar; deneme yayınlarında tarayıcı testi yoktur, yalnız yeni sürümün adreste göründüğü denetlenir.
# Konu dalları kendi alan testlerini yerelde koşar. Duman bozulursa "Canlı duman hatası" kaydı (issue) açılır.
# Gerekli tek ayar: Settings → Pages → Build and deployment → Source: GitHub Actions
name: Yayın

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  derle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      ana_surum: ${{ steps.ana.outputs.surum }}
      dev_surum: ${{ steps.dev.outputs.surum }}
      yeni_canli: ${{ steps.ana.outputs.yeni_canli }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ana sürüm (master)
        id: ana
        run: |
          if [ -f package.json ]; then
            npm ci
            npm run typecheck
            npm run lint
            npm run build
            V=$(node -p "require('./package.json').version")
            echo "surum=$V" >> "$GITHUB_OUTPUT"
            # canlıda şu an başka bir sürüm varsa bu yayın yeni bir canlı çıkıştır: yayından sonra canlı duman koşar
            C=$(curl -fsS "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/?$(date +%s)" | grep -o "APP_VERSION='[^']*'" | head -1 || true)
            if [ "$C" = "APP_VERSION='$V'" ]; then echo "yeni_canli=false" >> "$GITHUB_OUTPUT"; else echo "yeni_canli=true" >> "$GITHUB_OUTPUT"; fi
            mv dist site
          else
            # derleme adımı olmayan eski yapı: dosyalar olduğu gibi
            mkdir site
            rsync -a --exclude='.git*' --exclude=site --exclude=tools --exclude=docs --exclude=.claude --exclude='*.md' ./ site/
          fi
      - name: Deneme sürümü (gelistirme dalı → /dev/)
        id: dev
        run: |
          if git ls-remote --exit-code --heads origin gelistirme > /dev/null; then
            git fetch --depth 1 origin gelistirme
            git worktree add ../gel FETCH_HEAD
            cd ../gel
            if npm ci && npm run typecheck && npm run lint && npx vite build --mode gelistirme; then
              mv dist "$GITHUB_WORKSPACE/site/dev"
              echo "surum=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
            else
              mkdir -p "$GITHUB_WORKSPACE/site/dev"
              echo '<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Deneme</title><p style="font:18px sans-serif;padding:24px">Deneme sürümü derlenemedi ya da denetimleri geçmedi. Ana sürüm etkilenmedi.</p>' > "$GITHUB_WORKSPACE/site/dev/index.html"
            fi
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  yayinla:
    needs: derle
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      - id: dep
        uses: actions/deploy-pages@v4

  kontrol:
    needs: [derle, yayinla]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Yeni sürümler adreste göründü mü
        env:
          ANA: ${{ needs.derle.outputs.ana_surum }}
          DEV: ${{ needs.derle.outputs.dev_surum }}
        run: |
          A="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          bekle() {
            [ -z "$2" ] && return 0
            for i in $(seq 1 40); do
              curl -fsS "$1?$(date +%s)" | grep -q "APP_VERSION='$2'" && { echo "$1 → $2"; return 0; }
              sleep 15
            done
            echo "$1 adresinde $2 görünmedi"; return 1
          }
          bekle "$A" "$ANA"
          bekle "${A}dev/" "$DEV"

  canli-duman:
    # yalnız yeni bir canlı çıkıştan sonra (canlıdaki sürüm değişti): canlı adreste tarayıcı dumanı
    if: needs.derle.outputs.yeni_canli == 'true'
    needs: [derle, yayinla]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npx playwright install chromium
      - name: Yeni sürüm canlıda mı
        run: |
          V=$(node -p "require('./package.json').version")
          A="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          echo "ADRES=$A" >> "$GITHUB_ENV"
          for i in $(seq 1 40); do
            curl -fsS "$A?$(date +%s)" | grep -q "APP_VERSION='$V'" && exit 0
            sleep 15
          done
          echo "canlı adreste $V görünmedi"; exit 1
      - name: Canlı duman (ana sürüm)
        run: node tests/kosucu.mjs duman --adres "$ADRES"
      - name: Hata kaydı
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "Yayından sonra canlı adreste duman testi kaldı: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"; echo;
            cat tests/cikti/rapor.md 2>/dev/null; } > govde.md
          gh issue create --title "Canlı duman hatası: $(node -p "require('./package.json').version")" --body-file govde.md
