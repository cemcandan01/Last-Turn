# Yayın: master → https://cemcandan01.github.io/Last-Turn/ , gelistirme dalı → .../Last-Turn/dev/ (deneme sürümü).
# Yayından önce duman testi (tip denetimi, kod denetimi, hızlı tarayıcı turu); geçmezse yayın yapılmaz, telefondaki sürüm
# değişmez. Deneme sürümü derlenemezse yalnız ana sürüm yayınlanır. Yayından sonra canlı adreste duman koşar; bozulma
# varsa "Canlı duman hatası" kaydı (issue) açılır.
# Gerekli tek ayar: Settings → Pages → Build and deployment → Source: GitHub Actions
name: Yayın

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  derle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ana sürüm (master)
        run: |
          if [ -f package.json ]; then
            npm ci
            npx playwright install --with-deps chromium
            npm run typecheck
            npm run lint
            node tests/kosucu.mjs duman
            mv dist site
          else
            # derleme adımı olmayan eski yapı: dosyalar olduğu gibi
            mkdir site
            rsync -a --exclude='.git*' --exclude=site --exclude=tools --exclude=docs --exclude=.claude --exclude='*.md' ./ site/
          fi
      - name: Deneme sürümü (gelistirme dalı → /dev/)
        run: |
          if git ls-remote --exit-code --heads origin gelistirme > /dev/null; then
            git fetch --depth 1 origin gelistirme
            git worktree add ../gel FETCH_HEAD
            cd ../gel
            if npm ci && npx playwright install --with-deps chromium && npx vite build --mode gelistirme && node tests/kosucu.mjs duman --derlemeden; then
              mv dist "$GITHUB_WORKSPACE/site/dev"
            else
              mkdir -p "$GITHUB_WORKSPACE/site/dev"
              echo '<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Deneme</title><p style="font:18px sans-serif;padding:24px">Deneme sürümü derlenemedi ya da testleri geçmedi. Ana sürüm etkilenmedi.</p>' > "$GITHUB_WORKSPACE/site/dev/index.html"
            fi
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  yayinla:
    needs: derle
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      - id: dep
        uses: actions/deploy-pages@v4

  canli-duman:
    needs: yayinla
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npx playwright install --with-deps chromium
      - name: Yeni sürüm canlıda mı
        run: |
          V=$(node -p "require('./package.json').version")
          A="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          echo "ADRES=$A" >> "$GITHUB_ENV"
          for i in $(seq 1 40); do
            curl -fsS "$A?$(date +%s)" | grep -q "APP_VERSION='$V'" && exit 0
            sleep 15
          done
          echo "canlı adreste $V görünmedi"; exit 1
      - name: Canlı duman (ana sürüm)
        run: node tests/kosucu.mjs duman --adres "$ADRES"
      - name: Canlı duman (deneme sürümü)
        if: always()
        run: |
          git fetch -q --depth 1 origin gelistirme || { echo "deneme dalı yok"; exit 0; }
          V=$(git show FETCH_HEAD:package.json | node -p "JSON.parse(require('fs').readFileSync(0)).version")
          for i in $(seq 1 40); do
            curl -fsS "${ADRES}dev/?$(date +%s)" | grep -q "APP_VERSION='$V'" && break
            sleep 15
          done
          curl -fsS "${ADRES}dev/" | grep -q "APP_VERSION='$V'" || { echo "deneme adresinde $V görünmedi"; exit 1; }
          cp tests/cikti/rapor.md tests/cikti/rapor-ana.md 2>/dev/null || true
          # deneme sürümü kendi dalının testleriyle denetlenir (master'ın testleri eski olabilir)
          git worktree add -q ../gel FETCH_HEAD
          cd ../gel && npm ci --silent
          set +e
          node tests/kosucu.mjs duman --adres "${ADRES}dev/"; kod=$?
          mkdir -p "$GITHUB_WORKSPACE/tests/cikti" && cp tests/cikti/rapor.md "$GITHUB_WORKSPACE/tests/cikti/rapor.md" 2>/dev/null
          exit $kod
      - name: Hata kaydı
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "Yayından sonra canlı adreste duman testi kaldı: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"; echo;
            cat tests/cikti/rapor-ana.md tests/cikti/rapor.md 2>/dev/null; } > govde.md
          gh issue create --title "Canlı duman hatası: $(node -p "require('./package.json').version")" --body-file govde.md
