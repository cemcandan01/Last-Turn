# Denetim: konu dalına her gönderimde tip denetimi, kod denetimi, biçim ve alan testi
# (yalnız dalın kendi senaryoları; dal adı tests/senaryolar/<dal>.mjs ile eşleşir, eşleşmezse koşacak senaryo yoktur).
name: Denetim

on:
  push:
    branches-ignore: [master, gelistirme, regresyon]
  pull_request:
  workflow_dispatch:

jobs:
  denetim:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tip denetimi
        run: npm run typecheck
      - name: Kod denetimi
        run: npm run lint
      - name: Biçim
        run: npm run format:check
      - name: Tarayıcı
        run: npx playwright install chromium
      - name: Alan testi
        # Unity geçiş dallarının C# doğrulaması unity-dogrulama.yml'dedir;
        # TypeScript alan koşucusu yalnız kayıtlı TypeScript alanları için çalışır.
        if: ${{ !startsWith(github.head_ref || github.ref_name, 'codex/unity-') && !startsWith(github.head_ref || github.ref_name, 'claude/unity-') }}
        run: node tests/kosucu.mjs alan "${GITHUB_REF_NAME}"
      - name: Rapor
        if: always()
        run: cat tests/cikti/rapor.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Yarış dönüşü görsel kanıtı
        if: always() && hashFiles('tests/cikti/yarista-reset-iphone13.png') != ''
        uses: actions/upload-artifact@v4
        with:
          name: yarista-reset-iphone13
          path: tests/cikti/yarista-reset-iphone13.png
      - name: Garaj düzeni görsel kanıtı
        if: always() && hashFiles('tests/cikti/garaj-duzen-iphone13.png') != ''
        uses: actions/upload-artifact@v4
        with:
          name: garaj-duzen-iphone13
          path: tests/cikti/garaj-duzen-iphone13.png

      - name: Kariyer görsel kanıtı
        if: always() && hashFiles('tests/cikti/kariyer-kupa-iphone13.png') != ''
        uses: actions/upload-artifact@v4
        with:
          name: kariyer-kupa-iphone13
          path: tests/cikti/kariyer-kupa-iphone13.png

      - name: Yakın takip görsel kanıtı
        if: always() && hashFiles('tests/cikti/kamera-yakin-iphone13.png') != ''
        uses: actions/upload-artifact@v4
        with:
          name: kamera-yakin-iphone13
          path: tests/cikti/kamera-yakin-iphone13.png
