# Denetim: konu dalına her gönderimde tip denetimi, kod denetimi, biçim ve alan testi
# (dalın kendi senaryoları + duman; dal adı tests/senaryolar/<dal>.mjs ile eşleşir, eşleşmezse yalnız duman).
name: Denetim

on:
  push:
    branches-ignore: [master, gelistirme]
  pull_request:
  workflow_dispatch:

jobs:
  denetim:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tip denetimi
        run: npm run typecheck
      - name: Kod denetimi
        run: npm run lint
      - name: Biçim
        run: npm run format:check
      - name: Tarayıcı
        run: npx playwright install chromium
      - name: Alan testi
        run: node tests/kosucu.mjs alan "${GITHUB_REF_NAME}"
      - name: Rapor
        if: always()
        run: cat tests/cikti/rapor.md >> "$GITHUB_STEP_SUMMARY" || true
