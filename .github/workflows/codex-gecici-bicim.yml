# Geçici tek-dal Prettier biçim düzeltmesi. Denetim tamamlanınca kaldırılacak.
name: Codex geçici biçim
on:
  push:
    branches:
      - codex/mutant-drift-laboratuvari
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/mutant-drift-laboratuvari
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Yalnız bu görevin değişen dosyalarını biçimle
        run: |
          npx prettier --write             src/arayuz/mutant-ui.ts src/fizik/ortak.ts             src/oyun/mutant-kosu.ts src/oyun/mutant.ts src/oyun/yarislar.ts             tests/birim/mutant-drift-test.test.ts tests/birim/mutant.test.ts
      - name: Biçimi bu konu dalına gönder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/arayuz/mutant-ui.ts src/fizik/ortak.ts src/oyun/mutant-kosu.ts src/oyun/mutant.ts src/oyun/yarislar.ts tests/birim/mutant-drift-test.test.ts tests/birim/mutant.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(mutant): Prettier biçim düzeltmeleri"
            git push origin HEAD:codex/mutant-drift-laboratuvari
          fi
