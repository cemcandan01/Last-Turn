# Geçici Prettier görevi: çalıştıktan sonra kendi dosyasını da kaldırır.
name: Codex tek sefer biçim
on:
  push:
    branches:
      - codex/mutant-drift-laboratuvari
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/mutant-drift-laboratuvari
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Görevin değişen dosyalarını biçimle
        run: |
          npx prettier --write             src/arayuz/mutant-ui.ts src/fizik/ortak.ts             src/oyun/mutant-kosu.ts src/oyun/mutant.ts src/oyun/yarislar.ts             tests/birim/mutant-drift-test.test.ts tests/birim/mutant.test.ts
      - name: Biçimi gönder ve geçici iş akışını kaldır
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/arayuz/mutant-ui.ts src/fizik/ortak.ts src/oyun/mutant-kosu.ts src/oyun/mutant.ts src/oyun/yarislar.ts tests/birim/mutant-drift-test.test.ts tests/birim/mutant.test.ts
          git rm .github/workflows/codex-gecici-bicim.yml
          git commit -m "style(mutant): kaynak sandığı biçimi ve geçici CI temizliği"
          git push origin HEAD:codex/mutant-drift-laboratuvari
