name: DEV panel format and focused validation
on:
  push:
    branches:
      - codex/mutant-canli-dev-panel
    paths:
      - .github/workflows/dev-validation-once.yml
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/mutant-canli-dev-panel
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/arayuz/mutant-ui.ts src/oyun/mutant-kosu.ts tests/birim/mutant.test.ts tests/birim/mutant-drift-test.test.ts tests/e2e/bolumler/mutant-dev.mjs tests/e2e/duman.mjs tests/senaryolar/mutant.mjs
      - name: Store formatted code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/arayuz/mutant-ui.ts src/oyun/mutant-kosu.ts tests/birim/mutant.test.ts tests/birim/mutant-drift-test.test.ts tests/e2e/bolumler/mutant-dev.mjs tests/e2e/duman.mjs tests/senaryolar/mutant.mjs
          if ! git diff --cached --quiet; then
            git commit -m "style(mutant): DEV panel final Prettier"
            git push origin HEAD:codex/mutant-canli-dev-panel
          fi
      - run: npm run typecheck && npm run lint && npm run format:check
      - run: npx vitest run tests/birim/mutant-drift-test.test.ts tests/birim/mutant.test.ts
      - run: npx playwright install chromium
      - run: npm run build
      - run: node tests/e2e/duman.mjs --bolum mutant-dev
